spring:
  application:
    name: risk
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:risk;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    placeholders:
      risk_schema_initialization: "CREATE SCHEMA IF NOT EXISTS risk"

server:
  servlet:
    context-path: /

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

swagger:
  title: Risk Organograma API
  description: Test configuration
  version: test
