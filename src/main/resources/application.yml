spring:
  application:
    name: risk
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=ElyxDB;encrypt=false;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    placeholders:
      risk_schema_initialization: "IF NOT EXISTS (SELECT * FROM sys.schemas WHERE name = 'risk') EXEC('CREATE SCHEMA risk')"

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: alpha

swagger:
  title: Risk Organograma API
  description: API de gestão organizacional da plataforma Risk
  version: ${APP_VERSION:0.0.1-SNAPSHOT}
  terms-of-service-url:
  contact-name:
  contact-url:
  contact-email:
  license:
  license-url:
  external-documentation:
  external-documentation-url:

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "
