services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${DATABASE_SA_PASSWORD:-Risk_Local_2026!}
    ports:
      - "1433:1433"
    volumes:
      - risk_sqlserver_data:/var/opt/mssql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mssqltools:
    image: mcr.microsoft.com/mssql-tools
    platform: linux/amd64
    environment:
      DATABASE_SA_PASSWORD: ${DATABASE_SA_PASSWORD:-Risk_Local_2026!}
    volumes:
      - ./infra/create-database.sql:/tmp/create-database.sql:ro
    depends_on:
      sql-server:
        condition: service_healthy
    command: ["/bin/bash", "-c", "/opt/mssql-tools/bin/sqlcmd -S sql-server -U sa -P \"$${DATABASE_SA_PASSWORD}\" -d master -i /tmp/create-database.sql"]
    networks:
      - app-network

  app:
    build: .
    image: elyx-risk-local:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sql-server:1433;databaseName=ElyxDB;encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_SA_PASSWORD:-Risk_Local_2026!}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev
    ports:
      - "8080:8080"
    depends_on:
      sql-server:
        condition: service_healthy
      mssqltools:
        condition: service_completed_successfully
    networks:
      - app-network

  front:
    build:
      context: ${RISK_FRONT_DIR:-../risk-front}
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: elyx-risk-front-local:latest
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

  integration-tests:
    image: maven:3.9.4-eclipse-temurin-21
    profiles: ["tests"]
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - risk_maven_repository:/root/.m2
    depends_on:
      app:
        condition: service_healthy
    command: mvn --batch-mode verify
    networks:
      - app-network

volumes:
  risk_sqlserver_data:
  risk_maven_repository:

networks:
  app-network:
